<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#141414">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-uLhD/r2Bu+yRMzVNGyOPQhGusfjjpgJEKiXwWQIiBOQ='; style-src 'self'; img-src 'self' blob: data:; connect-src 'none'; media-src blob:; base-uri 'none'; form-action 'none'">
<title>字浪 · 薛仁雅档案</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js"}}</script>
<script type="module" src="./app.js"></script>
</head>
<body>
<header class="bar"><a href="./">← 滤镜列表</a><h1>字浪</h1></header>
<main>
  <section class="editor" aria-label="字浪滤镜">
    <div class="viewer">

      <div id="stage" class="stage">
        <div class="empty" id="empty">
          <svg width="35" height="35" viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M12 4H4v8m20-8h8v8M4 24v8h8m20-8v8h-8M18 11v14m-7-7h14" stroke="currentColor"/></svg>
          <button type="button" class="file-primary" data-pick>选择本地图片</button>
          <p>也可以把图片拖到这里</p>
        </div>
        <canvas id="preview" hidden aria-label="滤镜预览"></canvas>
        <img id="original" hidden alt="你选择的原图">
      </div>
      <div class="viewer-foot"><span id="image-info">正在读取示例</span><span id="screen-status">未选图</span></div>
    </div>
    <aside class="controls" aria-label="滤镜设置">
      <h2>调整</h2>
      <fieldset>
        <legend>画面</legend>
        <div class="modes"><label><input type="radio" name="mode" value="ascii" checked><span>字符</span></label><label><input type="radio" name="mode" value="flow"><span>光丝</span></label></div>
      </fieldset>
      <div class="range-row"><label for="amp">风幅</label><output id="amp-value" for="amp">1.00</output></div>
      <input type="range" id="amp" min="0" max="2" step=".05" value="1">
      <div class="actions">
        <button type="button" id="pause" disabled>暂停</button>
        <button type="button" id="compare" aria-pressed="false" disabled>看原图</button>
        <button type="button" id="save" disabled>保存当前帧</button>
        <button type="button" id="change" data-pick>换成我的照片</button>
        <button type="button" id="reset-demo" hidden>恢复示例</button>
      </div>
      <p class="local"><i aria-hidden="true"></i>在浏览器内处理，不上传图片。</p>
    </aside>
  </section>
  <p id="notice" role="status" aria-live="polite"></p>
  <footer class="foot"><a href="./image-rights.html">图片版权 ↗</a><a href="./credits.html">开源与致谢 ↗</a></footer>
  <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif,image/bmp" hidden>
</main>
</body>
</html>
