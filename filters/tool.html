<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#141414">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'none'; media-src blob:; base-uri 'none'; form-action 'none'">
<title>长虹玻璃 · 薛仁雅档案</title>
<link rel="stylesheet" href="./style.css">
<script type="module" src="./art-tools.js?v=clear-ribs"></script>
<link rel="stylesheet" href="../assets/copyright.css?v=centered">
</head>
<body>
<header class="bar"><a href="./">← 滤镜列表</a><a href="../index/">站点索引</a><h1 id="tool-name">长虹玻璃</h1></header>
<main>
  <section class="editor" aria-label="滤镜工作区">
    <div class="viewer">

      <div id="stage" class="stage glass-stage">
        <div class="empty" id="empty">
          <svg width="35" height="35" viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M12 4H4v8m20-8h8v8M4 24v8h8m20-8v8h-8M18 11v14m-7-7h14" stroke="currentColor"/></svg>
          <button type="button" class="file-primary" data-pick>选择本地图片</button>
          <p>也可以把图片拖到这里</p>
        </div>
        <canvas id="preview" tabindex="0" hidden aria-label="滤镜预览。用方向键移动清晰区"></canvas>
        <img id="original" hidden alt="你选择的原图">
      </div>
      <div class="viewer-foot"><span id="image-info">正在读取示例</span><span id="screen-status">未选图</span></div>
    </div>
    <aside class="controls" aria-label="滤镜设置">
      <h2>调整</h2>
      <p class="tool-gesture">点照片，移动清晰区。</p>
      <fieldset id="mode-wrap"><legend>样式</legend>
        <div class="modes"><label><input type="radio" name="tone" value="a" checked><span>棱镜</span></label><label><input type="radio" name="tone" value="b"><span>磨砂</span></label></div>
      </fieldset>
      <fieldset id="coverage-wrap"><legend>范围</legend>
        <div class="modes"><label><input type="radio" id="coverage-full" name="coverage" value="full" checked><span>全图</span></label><label><input type="radio" name="coverage" value="half"><span>下半幅</span></label></div>
      </fieldset>
      <div class="range-row"><label for="amp" id="amp-label">强度</label><output id="amp-value" for="amp"></output></div>
      <input type="range" id="amp" min="0" max="100" value="65">
      <div class="range-row" id="detail-row"><label for="detail" id="detail-label">竖纹宽度</label><output id="detail-value" for="detail"></output></div>
      <input type="range" id="detail" min="0" max="100" value="50">
      <div class="actions">
        <button type="button" id="clean" disabled>重置效果</button>
        <button type="button" id="compare" aria-pressed="false" disabled>看原图</button>
        <button type="button" id="save" disabled>保存图片</button>
        <button type="button" id="change" data-pick>换成我的照片</button>
        <button type="button" id="reset-demo" hidden>恢复示例</button>
      </div>
      <p class="local"><i aria-hidden="true"></i>在浏览器内处理，不上传图片。</p>
    </aside>
  </section>
  <p id="notice" role="status" aria-live="polite"></p>
  <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif,image/bmp" hidden>
</main>
<footer class="site-footer">
  <nav class="footer-links" aria-label="相关资料"><a href="./image-rights.html">图片出处与许可笔记 ↗</a><a href="./references.html#glass-reference">原帖与设计参考 ↗</a><a href="./credits.html">开源与致谢 ↗</a></nav>
  <section class="archive-copyright" aria-labelledby="archive-copyright-title">
    <h2 id="archive-copyright-title">版权声明</h2>
    <p><strong>非官方 · 粉丝制作</strong>。本站为非营利的薛仁雅粉丝档案，与艺人、经纪公司及相关品牌无隶属关系。</p>
    <p>第三方素材版权归各权利人。<a href="mailto:alfro6ull@gmail.com">版权联系</a></p>
    <p>访客自行选用的照片和处理结果只在其浏览器中处理，本站不接收、不存储、不代发，也无法核验选用素材及后续分享是否获授权。</p>
  </section>
</footer>
</body>
</html>
