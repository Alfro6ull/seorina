<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20201c">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Gallery · Seorina</title>
<link rel="stylesheet" href="studies.css?v=colour"><link rel="stylesheet" href="../assets/copyright.css?v=shared-footer"><link rel="stylesheet" href="../filters/quick-index.css?v=clean-menu"><link rel="stylesheet" href="./gallery.css?v=moving-wall">
<script type="module" src="../filters/quick-index.js?v=all-destinations"></script><script type="module" src="./gallery.js?v=moving-wall"></script>
</head>
<body>
<main class="wall-world">
  <header class="wall-bar gallery-bar">
    <a href="../index/" data-quick-index>站点索引</a>
    <h1 lang="en">Gallery</h1>
    <output id="gallery-count" aria-label="当前浏览位置">—</output>
  </header>
  <section class="wall-stage" aria-label="横向照片墙">
    <div id="wall-scroll" class="wall-scroll" tabindex="0"><div id="wall" class="photo-wall"></div></div>
    <p id="gallery-status" class="gallery-status" role="status" hidden></p>
    <noscript><p class="gallery-status">请启用 JavaScript 查看图库。</p></noscript>
  </section>
  <div class="wall-bottom gallery-bottom">
    <span class="gallery-hint">横向滑动</span>
    <input id="gallery-position" class="gallery-position" type="range" min="0" max="1000" value="0" step="1" aria-label="跳到图库位置" disabled>
    <span class="gallery-arrows"><button id="gallery-prev" type="button" aria-label="向左浏览" disabled>←</button><button id="gallery-next" type="button" aria-label="向右浏览" disabled>→</button></span>
  </div>
</main>
<footer class="study-footer">
<!-- SITE-FOOTER:START -->
<section class="archive-copyright" aria-labelledby="archive-copyright-title">
  <h2 id="archive-copyright-title">版权声明</h2>
  <p><strong>非官方 · 粉丝制作。</strong> 本站为非营利的薛仁雅粉丝档案，与艺人、经纪公司及相关品牌无隶属关系。</p>
  <p>第三方素材版权归各权利人。 <span class="archive-copyright-links"><a href="../filters/credits.html">开源致谢</a> · <a href="../filters/image-rights.html#contact">版权问题反馈</a></span></p>
</section>
<!-- SITE-FOOTER:END -->
</footer>
</body>
</html>
