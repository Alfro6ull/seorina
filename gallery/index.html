<title>Gallery · Seorina</title>
<link rel="stylesheet" href="studies.css?v=colour"><link rel="stylesheet" href="../assets/copyright.css?v=shared-footer"><link rel="stylesheet" href="./gallery.css?v=wall-index">
<script type="module" src="./gallery.js?v=wall-index"></script>
</head>
<body>
<main class="wall-world">
  <header class="wall-bar gallery-bar">
    <details class="gallery-index">
      <summary aria-label="站点导航"><span aria-hidden="true">+</span></summary>
      <nav aria-label="站点导航">
        <a href="../" lang="en">Seorina</a><span aria-hidden="true">｜</span>
        <span class="gallery-index-section">
          <a href="../index/">索引</a><span class="index-colon" aria-hidden="true">：</span>
          <a href="../life/" lang="en">Life</a><span class="index-dot" aria-hidden="true">·</span>
          <a href="../filters/" lang="en">Filters</a><span class="index-dot" aria-hidden="true">·</span>
          <a href="../muse/" lang="en">Muse</a>
        </span><span aria-hidden="true">｜</span>
        <a href="./" aria-current="page">图库</a>
      </nav>
    </details>
    <h1 lang="en">Gallery</h1>
    <output id="gallery-count" aria-label="当前浏览位置">—</output>
  </header>
  <section class="wall-stage" aria-label="横向照片墙">
    <div id="wall-scroll" class="wall-scroll" tabindex="0"><div id="wall" class="photo-wall"></div></div>
    <p id="gallery-status" class="gallery-status" role="status" hidden></p>
    <noscript><p class="gallery-status">请启用 JavaScript 查看图库。</p></noscript>
  </section>
  <div class="wall-bottom gallery-bottom">
    <span class="gallery-hint">横向滑动</span>
    <input id="gallery-position" class="gallery-position" type="range" min="0" max="1000" value="0" step="1" aria-label="跳到图库位置" disabled>
    <span class="gallery-arrows"><button id="gallery-prev" type="button" aria-label="向左浏览" disabled>←</button><button id="gallery-next" type="button" aria-label="向右浏览" disabled>→</button></span>
  </div>
</main>
