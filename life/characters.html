<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>薛仁雅 · 小人预览</title>
  <style>
    html, body { margin:0; background:#fff; }
    #seorina-characters-preview { --ink:#16171d; --blue:#2628ef; --muted:#777984; --lamp:#ffe349; box-sizing:border-box; width:100%; max-width:820px; margin-inline:auto; padding:26px 30px 22px; color:var(--ink); background:#fff; color-scheme:light; font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif; }
    #seorina-characters-preview *, #seorina-characters-preview *::before, #seorina-characters-preview *::after { box-sizing:border-box; }
    #seorina-characters-preview button { font:inherit; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    #seorina-characters-preview .preview-header { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; min-height:48px; padding-right:38px; }
    #seorina-characters-preview .preview-brand { margin:0; color:var(--blue); font-size:24px; font-weight:750; line-height:1.2; letter-spacing:-.045em; }
    #seorina-characters-preview .preview-year { display:flex; align-items:baseline; gap:10px; margin:0; font-size:14px; line-height:1.5; white-space:nowrap; }
    #seorina-characters-preview .preview-year strong { font-size:26px; font-weight:500; line-height:1; letter-spacing:-.045em; font-variant-numeric:tabular-nums; }
    #seorina-characters-preview .preview-role { color:var(--muted); font-size:12px; }
    #seorina-characters-preview .year-stage { --stage-top:0px; --line-y:150px; position:relative; height:194px; overflow:hidden; isolation:isolate; }
    #seorina-characters-preview .year-stage::before { content:""; position:absolute; top:calc(var(--stage-top) + var(--line-y)); inset-inline:0; height:1px; background:#aaaab5; z-index:0; }
    #seorina-characters-preview .year-scroll { container-type:inline-size; position:absolute; top:calc(var(--stage-top) + var(--line-y) - 20px); inset-inline:0; height:64px; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior-x:contain; mask-image:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 12px),transparent); cursor:grab; touch-action:auto; z-index:1; }
    #seorina-characters-preview .year-scroll::-webkit-scrollbar { display:none; }
    #seorina-characters-preview .year-scroll[data-rail-dragging="true"] { cursor:grabbing; }
    #seorina-characters-preview .year-track { --slots:5; --stop-width:calc(100cqw / var(--slots)); position:relative; display:grid; grid-auto-flow:column; grid-auto-columns:var(--stop-width); width:max-content; padding-inline:calc((100cqw - var(--stop-width)) / 2); }
    #seorina-characters-preview .year-stop { position:relative; min-width:0; scroll-snap-align:center; }
    #seorina-characters-preview .year-node { appearance:none; position:relative; display:block; width:100%; min-width:0; height:64px; padding:32px 0 10px; border:0; border-radius:0; background:transparent; color:var(--muted); font-size:12px; font-weight:500; font-variant-numeric:tabular-nums; line-height:20px; text-align:center; cursor:inherit; touch-action:auto; user-select:none; }
    #seorina-characters-preview .year-node i { position:absolute; top:18px; left:50%; translate:-50% 0; width:5px; height:5px; border-radius:50%; background:#a9a9b2; }
    #seorina-characters-preview .year-node[aria-pressed="true"] { color:var(--ink); font-weight:700; }
    #seorina-characters-preview .year-node[aria-pressed="true"] i { background:var(--lamp); }
    #seorina-characters-preview .year-node:hover { color:var(--blue); }
    #seorina-characters-preview .year-node:focus-visible { outline-offset:-3px; }
    #seorina-characters-preview .stage-lamp { position:absolute; top:calc(var(--stage-top) + var(--line-y) - 3px); left:50%; translate:-50% 0; width:23px; height:6px; border-radius:50%; background:var(--lamp); z-index:1; }
    #seorina-characters-preview .stage-lamp::before { position:absolute; content:""; inset:-13px -17px; border-radius:50%; background:radial-gradient(ellipse,#ffe34975,transparent 72%); z-index:-1; }
    #seorina-characters-preview .year-avatar { --avatar-width:92px; position:absolute; top:calc(var(--stage-top) + var(--line-y) - var(--avatar-width) * .828125); left:50%; width:var(--avatar-width); aspect-ratio:8 / 7; translate:-50% 0; pointer-events:none; z-index:2; }
    #seorina-characters-preview .annual-canvas { display:block; position:absolute; left:-32px; top:0; width:calc(100% + 64px); height:100%; pointer-events:none; }
    #seorina-characters-preview .annual-trigger { position:absolute; inset:0 5px 3px; padding:0; border:0; background:transparent; border-radius:8px; pointer-events:auto; cursor:pointer; }
    #seorina-characters-preview .annual-trigger:hover { background:#2628ef04; }
    #seorina-characters-preview .guest-label { position:absolute; inset:22px 0 auto; margin:0; min-height:18px; color:var(--muted); font-size:12px; line-height:18px; text-align:center; pointer-events:none; }
    #seorina-characters-preview .preview-footer { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:2px 6px; margin-top:20px; font-size:12px; }
    #seorina-characters-preview .try-label { margin-right:4px; color:var(--muted); font-size:11px; }
    #seorina-characters-preview .egg-choice { appearance:none; min-width:44px; min-height:40px; padding:8px 6px; border:0; background:transparent; color:#50515d; font-size:12px; cursor:pointer; }
    #seorina-characters-preview .egg-choice:hover { color:var(--blue); }
    #seorina-characters-preview .preview-hint { margin:7px 0 0; color:#8b8c95; font-size:11px; line-height:1.6; text-align:center; }
    @media(max-width:480px) {
      #seorina-characters-preview { padding:22px 16px 18px; }
      #seorina-characters-preview .preview-header { gap:12px; padding-right:0; }
      #seorina-characters-preview .preview-brand { font-size:21px; }
      #seorina-characters-preview .preview-year { align-items:flex-end; flex-direction:column; gap:4px; }
      #seorina-characters-preview .preview-year strong { font-size:24px; }
      #seorina-characters-preview .preview-role { font-size:11px; }
      #seorina-characters-preview .preview-footer { gap:0 2px; margin-top:16px; }
      #seorina-characters-preview .try-label { flex:1 1 100%; margin:0; text-align:center; }
    }
  </style>
<link rel="stylesheet" href="../assets/copyright.css?v=centered">
</head>
<body>
  <section id="seorina-characters-preview" aria-label="薛仁雅年度造型与彩蛋小人">
    <header class="preview-header">
      <h1 class="preview-brand">SEORINA</h1>
      <p class="preview-year" role="status" aria-live="polite"><strong class="year-value">2023</strong><span class="preview-role">崔世京</span></p>
    </header>
    <div class="year-stage">
      <nav class="year-scroll" aria-label="拖动选择年份">
        <div class="year-track">
          <div class="year-stop"><button type="button" class="year-node" data-year="2017" aria-pressed="false" aria-label="2017 年，洪南珠"><i aria-hidden="true"></i>2017</button></div>
          <div class="year-stop"><button type="button" class="year-node" data-year="2020" aria-pressed="false" aria-label="2020 年，赵花真"><i aria-hidden="true"></i>2020</button></div>
          <div class="year-stop"><button type="button" class="year-node" data-year="2022" aria-pressed="false" aria-label="2022 年，陈映书"><i aria-hidden="true"></i>2022</button></div>
          <div class="year-stop"><button type="button" class="year-node" data-year="2023" aria-pressed="true" aria-label="2023 年，崔世京"><i aria-hidden="true"></i>2023</button></div>
          <div class="year-stop"><button type="button" class="year-node" data-year="2024" aria-pressed="false" aria-label="2024 年，铁人三项"><i aria-hidden="true"></i>2024</button></div>
          <div class="year-stop"><button type="button" class="year-node" data-year="2026" aria-pressed="false" aria-label="2026 年，姜在熙"><i aria-hidden="true"></i>2026</button></div>
        </div>
      </nav>
      <div class="stage-lamp" aria-hidden="true"></div>
      <div class="year-avatar">
        <canvas class="annual-canvas" aria-hidden="true"></canvas>
        <button type="button" class="annual-trigger" aria-label="召唤一个随机彩蛋小人"></button>
      </div>
      <p class="guest-label" role="status" aria-live="polite"></p>
    </div>
    <div class="preview-footer" role="group" aria-label="试试彩蛋">
      <span class="try-label">试试彩蛋</span>
      <button type="button" class="egg-choice" data-mode="dog">遛狗</button>
      <button type="button" class="egg-choice" data-mode="boxing">拳击</button>
      <button type="button" class="egg-choice" data-mode="bike">骑车</button>
      <button type="button" class="egg-choice" data-mode="skate">滑板</button>
      <button type="button" class="egg-choice" data-mode="guitar">吉他</button>
      <button type="button" class="egg-choice" data-mode="">更多</button>
    </div>
    <p class="preview-hint">拖动年份 · 点小人叫彩蛋</p>
  </section>
  <script src="seorina-character.js"></script>
  <script src="seorina-year-figures.js"></script>
  <script src="seorina-hobby-figures.js"></script>
  <script src="hero-easter-eggs.js"></script>
  <script src="year-rail-drag.js"></script>
  <script>
    (() => {
      'use strict';
      const root = document.getElementById('seorina-characters-preview');
      const stage = root.querySelector('.year-stage');
      const canvas = root.querySelector('.annual-canvas');
      const context = canvas.getContext('2d');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
      const viewport = root.querySelector('.year-scroll');
      const buttons = Array.from(root.querySelectorAll('.year-node'));
      const years = {
        '2017': { outfit:'uniform', label:'洪南珠' },
        '2020': { outfit:'royal', label:'赵花真' },
        '2022': { outfit:'business', label:'陈映书' },
        '2023': { outfit:'cello', label:'崔世京' },
        '2024': { outfit:'triathlete', label:'铁人三项' },
        '2026': { outfit:'undercover', label:'姜在熙' }
      };
      const scenes = [
        {mode:'dog',label:'遛狗'}, {mode:'boxing',label:'拳击'},
        {mode:'bike',label:'骑车'}, {mode:'skate',label:'滑板'},
        {mode:'guitar',label:'弹吉他'}, {mode:'piano',label:'弹钢琴'},
        {mode:'listen',label:'听歌'}, {mode:'puzzle',label:'拼拼图'},
        {mode:'gaming',label:'打游戏'}, {mode:'write',label:'摘抄'},
        {mode:'watch',label:'看影视'}, {mode:'travel',label:'旅行'},
        {mode:'eat',label:'吃饭'}, {mode:'relax',label:'独处'},
        {mode:'heart',label:'爱心'}, {mode:'martial',label:'柔术'},
        {mode:'ice',label:'速滑'}, {mode:'wave',label:'挥手'},
        {mode:'bow',label:'鞠躬'}, {mode:'script',label:'读剧本'}
      ];
      let current = '2023';
      let settleTimer = 0;
      let railInteraction = null;
      function drawAnnual() {
        const rect = canvas.getBoundingClientRect();
        if (!context || !rect.width || !rect.height) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        context.setTransform(dpr, 0, 0, dpr, 0, 0);
        window.SeorinaYearCharacter.draw(context, {
          outfit:years[current].outfit, x:rect.width / 2,
          y:rect.height * 53 / 56, height:64,
          facing:1, phase:0, moving:0, action:0
        });
      }
      const guestLabel = root.querySelector('.guest-label');
      const guests = window.SeorinaEasterEggs.attach(stage, {
        reduce, scenes,
        onStart(scene) { guestLabel.textContent = scene.label || ''; },
        onEnd() { guestLabel.textContent = ''; }
      });
      function centeredIndex() {
        const center = viewport.scrollLeft + viewport.clientWidth / 2;
        let nearest = 0, gap = Infinity;
        buttons.forEach((button, index) => {
          const stop = button.parentElement;
          const distance = Math.abs(stop.offsetLeft + stop.offsetWidth / 2 - center);
          if (distance < gap) { nearest = index; gap = distance; }
        });
        return nearest;
      }
      function settleYear() {
        clearTimeout(settleTimer);
        settleTimer = 0;
        if (railInteraction && railInteraction.isInteracting) return;
        const index = centeredIndex();
        current = buttons[index].dataset.year;
        buttons.forEach((item, i) => item.setAttribute('aria-pressed', String(i === index)));
        root.querySelector('.year-value').textContent = current;
        root.querySelector('.preview-role').textContent = years[current].label;
        drawAnnual();
      }
      function scheduleSettle(delay = 130) {
        clearTimeout(settleTimer);
        settleTimer = setTimeout(settleYear, delay);
      }
      function centerYear(index, smooth = true) {
        railInteraction?.cancel();
        const stop = buttons[index].parentElement;
        const left = stop.offsetLeft + stop.offsetWidth / 2 - viewport.clientWidth / 2;
        viewport.scrollTo({ left, behavior:smooth && !reduce.matches ? 'smooth' : 'auto' });
        if (!smooth || reduce.matches) settleYear();
        else scheduleSettle();
      }
      railInteraction = window.SeorinaYearRail.attach(viewport, {
        reduce,
        onStart() { clearTimeout(settleTimer); settleTimer = 0; },
        onEnd() { scheduleSettle(100); }
      });
      viewport.addEventListener('scroll', () => scheduleSettle(), {passive:true});
      viewport.addEventListener('scrollend', () => scheduleSettle(20));
      buttons.forEach((button, index) => button.addEventListener('click', () => centerYear(index)));
      viewport.addEventListener('keydown', event => {
        if (event.altKey || event.ctrlKey || event.metaKey) return;
        if (!['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;
        event.preventDefault();
        const focused = buttons.indexOf(event.target.closest('.year-node'));
        let next = focused >= 0 ? focused : centeredIndex();
        if (event.key === 'Home') next = 0;
        else if (event.key === 'End') next = buttons.length - 1;
        else next = Math.max(0, Math.min(buttons.length - 1, next + (event.key === 'ArrowLeft' ? -1 : 1)));
        buttons[next].focus({preventScroll:true});
        centerYear(next);
      });
      root.querySelector('.annual-trigger').addEventListener('click', () => guests.play());
      root.querySelectorAll('.egg-choice').forEach(button => button.addEventListener('click', () => guests.play(button.dataset.mode || undefined)));
      new ResizeObserver(drawAnnual).observe(canvas);
      new ResizeObserver(() => centerYear(buttons.findIndex(button => button.dataset.year === current), false)).observe(viewport);
      centerYear(buttons.findIndex(button => button.dataset.year === current), false);
      drawAnnual();
    })();
  </script>
