<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03080c"><meta name="color-scheme" content="dark">
<meta name="description" content="Interactive particle portrait.">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none';">
<title>Particle Portrait</title><link rel="stylesheet" href="../style.css?v=4"></head>
<body data-scene="particles"><main id="exhibit">
<canvas id="stage" aria-label="Interactive particle portrait"></canvas><img id="fallback" alt="" hidden><div class="vignette" aria-hidden="true"></div>
<button id="fullscreen" class="circle-button" aria-label="Fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M7 5h12v12"/></svg></button>
<div class="tools" aria-label="Scene controls">
<button id="prev" class="icon-button" aria-label="Previous photograph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg></button>
<span id="counter" class="counter" aria-live="polite">01 / 01</span>
<button id="next" class="icon-button" aria-label="Next photograph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
<button id="action" class="action-button" aria-label="Dissolve or reassemble">散开</button>
</div>
<p id="status" class="status" role="status" hidden></p><div id="loading" class="loading" role="status"><span></span></div>
<dialog id="viewer" aria-label="Photograph"><button class="viewer-close" data-close="viewer" aria-label="Close">×</button><img id="view-image" class="view-image" alt=""></dialog>
<noscript>JavaScript is required.</noscript></main><script type="module" src="../app.js?v=4"></script></body></html>
