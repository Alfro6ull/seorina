<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171613"><meta name="color-scheme" content="dark">
<meta name="description" content="MUSE — 以薛仁雅的生活照片为灵感，四座可探索的交互影像展厅。">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>MUSE / SEORINA</title><link rel="stylesheet" href="../style.css?v=2">
</head>
<body data-scene="particles">
<main id="exhibit">
  <canvas id="stage" aria-label="MUSE 交互影像展厅"></canvas>
  <img id="fallback" alt="当前照片" hidden>
  <div class="vignette" aria-hidden="true"></div>
  <header class="top">
    <div class="brand-group"><a id="brand" class="brand" href="../">MUSE</a><a id="archive-link" class="archive-link" href="../../index/" aria-label="返回站点索引">SEORINA</a></div>
    <div class="top-controls"><button id="library-open" class="library-button" aria-haspopup="dialog">图库 <span id="count">00</span></button><button id="fullscreen" class="circle-button" aria-label="切换全屏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M7 5h12v12"/></svg></button></div>
  </header>
  <div class="art-copy"><h1 id="scene-title">Infinite</h1><p id="scene-subtitle">01 / 无限影像宇宙</p></div>
  <div class="photo-caption"><span id="photo-title"></span><small id="demo-label" hidden></small><a id="source" target="_blank" rel="noopener noreferrer" hidden>原帖 ↗</a></div>
  <span id="depth-note" class="depth-note" hidden></span>
  <div class="tools" aria-label="照片与场景控制">
    <button id="prev" class="icon-button" aria-label="上一张照片"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg></button><span id="counter" class="counter">01 / 01</span><button id="next" class="icon-button" aria-label="下一张照片"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
    <span class="divider" aria-hidden="true"></span><button id="action" class="action-button">重置视角</button><button id="inspect" class="icon-button" aria-label="查看原图"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/></svg></button>
    <button id="motion" class="icon-button motion-button" aria-label="暂停自动运动" aria-pressed="true"><svg class="pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg><svg class="play" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7Z"/></svg></button>
  </div>
  <div class="bottom">
    <p id="hint" class="hint">拖动探索 · 滚动穿行</p>
    <nav class="scenes" aria-label="四座影像展厅">
      <a data-mode="infinite" href="../infinite/"><span>01</span><strong>Infinite</strong></a>
      <a data-mode="prism" href="../prism/"><span>02</span><strong>Prism</strong></a>
      <a data-mode="ribbon" href="../ribbon/"><span>03</span><strong>Ribbon</strong></a>
      <a data-mode="particles" href="../particles/"><span>04</span><strong>Particles</strong></a>
    </nav>
    <footer class="rights"><span>非官方 · 粉丝制作</span><span aria-hidden="true">/</span><a id="rights-link" href="../credits.html">版权与图片出处</a></footer>
  </div>
  <p id="status" class="status" role="status" hidden></p>
  <div id="loading" class="loading" role="status"><span>MUSE</span><small>正在进入展厅</small></div>
</main>
<dialog id="library" aria-labelledby="lib-title">
  <div class="dialog-head"><h2 id="lib-title">照片收藏</h2><button data-close="library" aria-label="关闭图库">×</button></div>
  <p>四个展厅，共用这一份图库。加入照片，就能换一种方式看她。</p>
  <div id="drop" class="drop"><label>导入照片 <span aria-hidden="true">＋</span><input id="files" type="file" accept="image/jpeg,image/png,image/webp,image/avif" multiple aria-label="选择要导入的照片"></label><small>也可拖入这里 · 仅保存在当前浏览器，不上传</small></div>
  <p id="import-status" class="import-status" role="status"></p>
  <div class="library-info"><span id="library-count"></span><button id="clear-local">清除本地导入</button></div>
  <div id="library-grid" class="library-grid"></div>
  <p class="fine">请使用你有权分享的照片。公共图库的来源记录见 <a href="../credits.html">图片出处</a>。</p>
</dialog>
<dialog id="viewer" aria-labelledby="view-title"><button class="viewer-close" data-close="viewer" aria-label="关闭原图">×</button><img id="view-image" class="view-image" alt=""><div class="viewer-caption"><span id="view-title"></span><a id="view-source" target="_blank" rel="noopener noreferrer" hidden>打开 Instagram 原帖 ↗</a></div></dialog>
<noscript>开启 JavaScript 可进入交互展厅。<a href="../../index/">返回站点索引</a>。</noscript>
<script type="module" src="../app.js?v=2"></script>
</body></html>
